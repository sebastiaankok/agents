name: Publish

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  CONTROLLER_IMAGE: ghcr.io/sebastiaankok/agents/controller
  RUNNER_IMAGE: ghcr.io/sebastiaankok/agents/opencode-runner

jobs:
  release-binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Build agentctl
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -o agentctl-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/agentctl

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.sha }}
          files: agentctl-${{ matrix.goos }}-${{ matrix.goarch }}

  build-controller:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push controller
        uses: docker/build-push-action@v5
        with:
          context: .
          file: cmd/controller/Dockerfile
          push: true
          tags: |
            ${{ env.CONTROLLER_IMAGE }}:latest
            ${{ env.CONTROLLER_IMAGE }}:${{ github.sha }}

  build-runner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push opencode-runner
        uses: docker/build-push-action@v5
        with:
          context: opencode-runner
          push: true
          tags: |
            ${{ env.RUNNER_IMAGE }}:latest
            ${{ env.RUNNER_IMAGE }}:${{ github.sha }}
